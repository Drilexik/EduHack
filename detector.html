<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detekce nepozornosti — testovaci stranka</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 820px; color:#111; }
  h1 { font-size: 1.3rem; }
  .stat { display: flex; gap: .75rem; flex-wrap: wrap; margin: 1rem 0; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: .6rem 1rem; min-width:120px; }
  .card span { color:#666; font-size:.8rem; }
  .card b { font-size: 1.6rem; display: block; }
  #log { border: 1px solid #ccc; border-radius: 8px; height: 260px; overflow:auto;
         padding:.5rem; font-family: ui-monospace, monospace; font-size: .82rem; background:#fafafa; }
  .ev-blur{color:#c00} .ev-focus{color:#070} .ev-copy{color:#a60} .ev-vis{color:#06c}
  textarea { width:100%; height:64px; margin:.5rem 0; }
</style>
</head>
<body>
<h1>Detekce nepozornosti — testovaci stranka</h1>
<p>Prepni na jiny tab / okno a zkopiruj text nize (Ctrl+C). <b>Bez</b> rozsireni se
udalosti zaznamenaji, <b>s</b> rozsirenim ne.</p>

<div class="stat">
  <div class="card"><span>Opusteni okna</span><b id="blurCount">0</b></div>
  <div class="card"><span>Skryti tabu</span><b id="hideCount">0</b></div>
  <div class="card"><span>Kopirovani</span><b id="copyCount">0</b></div>
  <div class="card"><span>Stav</span><b id="state">—</b></div>
</div>

<textarea>Zkus zkopirovat tento text pres Ctrl+C.</textarea>
<div id="log"></div>

<script>
  const $ = id => document.getElementById(id);
  let blur = 0, hide = 0, copy = 0;
  const log = (cls, msg) => {
    const d = document.createElement('div');
    d.className = cls;
    d.textContent = new Date().toLocaleTimeString() + '  ' + msg;
    $('log').prepend(d);
  };

  document.addEventListener('visibilitychange', () => {
    $('state').textContent = document.visibilityState;
    if (document.hidden) { hide++; $('hideCount').textContent = hide; log('ev-vis', 'Tab skryt (visibilitychange -> hidden)'); }
    else log('ev-vis', 'Tab zpet (visibilitychange -> visible)');
  });
  window.addEventListener('blur',  () => { blur++; $('blurCount').textContent = blur; log('ev-blur', 'Okno ztratilo fokus (blur)'); });
  window.addEventListener('focus', () => log('ev-focus', 'Okno ziskalo fokus (focus)'));
  document.addEventListener('copy',  () => { copy++; $('copyCount').textContent = copy; log('ev-copy', 'Zaznamenano kopirovani (copy)'); });
  document.addEventListener('paste', () => log('ev-copy', 'Zaznamenano vlozeni (paste)'));

  $('state').textContent = document.visibilityState;
  log('', 'Detektor spusten. visibilityState=' + document.visibilityState +
         ', hasFocus=' + document.hasFocus());
</script>
</body>
</html>
